<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eve Surface Reference</title>
  <link rel="stylesheet" href="../packages/eve-browser-lowering/styles.css" />
  <link rel="stylesheet" href="./cultui-reference-overrides.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Eve Surface Reference</h1>
      <p id="status">booting browser reference renderer</p>
    </div>
    <div class="hud">
      <strong>EVE</strong>
      <span id="surface-id">surface none</span>
      <span id="surface-version">v0</span>
    </div>
  </header>

  <section class="provider-bar" aria-label="Provider target">
    <label for="provider-select">Target</label>
    <select id="provider-select"></select>
    <div id="provider-meta" class="provider-meta">loading providers</div>
  </section>

  <main id="app" class="surface"></main>

  <script type="module" src="./surface.js"></script>
</body>
</html>
